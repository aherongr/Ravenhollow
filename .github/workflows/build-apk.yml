name: Build Ravenhollow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild source archive
        shell: bash
        run: |
          cat source_chunks/part*.b64 | tr -d '\r\n' | base64 --decode > RavenhollowAndroid-v0.6.1-source.zip
          echo "9ae25f1adb6d8d91fc083c3ed445c2297e20343c890a93af248ed12951843a93  RavenhollowAndroid-v0.6.1-source.zip" | sha256sum -c -
          unzip -t RavenhollowAndroid-v0.6.1-source.zip
          unzip -q RavenhollowAndroid-v0.6.1-source.zip
      - name: Apply compile fixes
        shell: bash
        run: |
          sed -i 's/ModelInstaller.installedGguf(context)/ModelInstaller.installedGguf(this.context)/' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/LocalEngines.kt
      - name: Verify source
        working-directory: RavenhollowAndroid
        run: sh ./verify_project.sh
      - name: Build debug APK
        working-directory: RavenhollowAndroid
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp RavenhollowAndroid/app/build/outputs/apk/debug/app-debug.apk Ravenhollow-v0.6.1-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ravenhollow-v0.6.1-debug-apk
          path: Ravenhollow-v0.6.1-debug.apk
