name: Build Ravenhollow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        shell: bash
        run: |
          cat source_chunks/part*.b64 | tr -d '\r\n' | base64 --decode > RavenhollowAndroid-v0.6.1-source.zip
          unzip -q RavenhollowAndroid-v0.6.1-source.zip
      - name: Dump story path
        shell: bash
        run: |
          echo '===== RavenRepository.kt ====='
          cat RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/RavenRepository.kt
          echo '===== RavenDatabase.kt ====='
          cat RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/RavenDatabase.kt
          echo '===== MainActivity.kt lines 100-230 ====='
          sed -n '100,230p' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/MainActivity.kt
          echo '===== MainActivity error/selftest matches ====='
          grep -n -i -E 'error|exception|self.?test|interact|generat|snackbar|message' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/MainActivity.kt || true
