name: Build Ravenhollow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        shell: bash
        run: |
          cat source_chunks/part*.b64 | tr -d '\r\n' | base64 --decode > RavenhollowAndroid-v0.6.1-source.zip
          echo "9ae25f1adb6d8d91fc083c3ed445c2297e20343c890a93af248ed12951843a93  RavenhollowAndroid-v0.6.1-source.zip" | sha256sum -c -
          unzip -t RavenhollowAndroid-v0.6.1-source.zip
          unzip -q RavenhollowAndroid-v0.6.1-source.zip

      - name: Apply inference and model replacement fixes
        run: |
          python3 ci/patch_inference_v062.py
          python3 ci/patch_inference_v063.py
          python3 ci/patch_model_replace_v064.py

      - name: Verify v0.6.4 model replacement
        shell: bash
        run: |
          grep -n -F 'installedGgufInfo' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/ModelInstaller.kt
          grep -n -F 'OpenableColumns.DISPLAY_NAME' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/ModelInstaller.kt
          grep -n -F 'LocalEngineRegistry.releaseText()' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/MainActivity.kt
          grep -n -F 'loadedLength' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/LocalEngines.kt
          grep -n -F 'Replace / import GGUF' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app/MainActivity.kt
          if grep -R -F '/no_think' RavenhollowAndroid/app/src/main/java/gr/ravenhollow/app; then
            echo 'Qwen3 /no_think token unexpectedly remains in v0.6.4' >&2
            exit 1
          fi
          grep -n -E 'versionCode|versionName' RavenhollowAndroid/app/build.gradle.kts

      - name: Verify source
        working-directory: RavenhollowAndroid
        run: sh ./verify_project.sh

      - name: Prepare side-by-side Safe 4 package
        run: python3 ci/make_side_by_side_v064.py
      - name: Verify Safe 4 package identity and provider
        shell: bash
        run: |
          grep -F 'applicationId = "gr.ravenhollow.app.safe064"' RavenhollowAndroid/app/build.gradle.kts
          grep -F 'gr.ravenhollow.app.safe064.files' RavenhollowAndroid/app/src/main/AndroidManifest.xml
          grep -F 'Ravenhollow Safe 4' RavenhollowAndroid/app/src/main/AndroidManifest.xml
          if grep -F 'gr.ravenhollow.app.files' RavenhollowAndroid/app/src/main/AndroidManifest.xml; then
            echo 'Old provider authority still present' >&2
            exit 1
          fi

      - name: Build side-by-side Safe 4 APK
        working-directory: RavenhollowAndroid
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Rename Safe 4 APK
        run: cp RavenhollowAndroid/app/build/outputs/apk/debug/app-debug.apk Ravenhollow-v0.6.4-safe4-side-by-side.apk

      - name: Upload Safe 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ravenhollow-v0.6.4-safe4-side-by-side-apk
          path: Ravenhollow-v0.6.4-safe4-side-by-side.apk
