name: Build Ravenhollow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack source
        run: unzip -q RavenhollowAndroid-v0.6.1-source.zip
      - name: Verify source
        working-directory: RavenhollowAndroid
        run: sh ./verify_project.sh
      - name: Build debug APK
        working-directory: RavenhollowAndroid
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp RavenhollowAndroid/app/build/outputs/apk/debug/app-debug.apk Ravenhollow-v0.6.1-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ravenhollow-v0.6.1-debug-apk
          path: Ravenhollow-v0.6.1-debug.apk
